<!doctype html>
<html lang="en">
  <head>

    <title>Thank you | PrismWeb Labs</title>
    <link rel="icon" href="/logo.jpg" />
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
        padding: 24px; color: #f4f6fb; text-align: center;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        background: radial-gradient(ellipse at bottom, #1b2735 0%, #090a0f 100%);
      }
      .card { max-width: 460px; padding: 40px 28px; border: 1px solid rgba(255,255,255,.1); border-radius: 28px; background: #0d1117; }
      img { width: 72px; height: 72px; border-radius: 20px; background: #fff; padding: 3px; object-fit: contain; }
      h1 { margin: 20px 0 8px; font-size: 28px; }
      p { margin: 0 0 24px; color: #9aa4b5; line-height: 1.6; }
      a { display: inline-block; padding: 12px 28px; border-radius: 999px; background: #fff; color: #000; text-decoration: none; font-weight: 600; }

  </head>
  <body>
    <div class="card">
      <img src="/logo.jpg" alt="PrismWeb Labs" />
      <h1>Thank you!</h1>
      <p>Your message was sent to PrismWeb Labs. We will reply to your email soon.</p>
      <a href="/">Back to website</a>
